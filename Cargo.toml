[package]
name = "fds-final"
version = "0.1.0"
edition = "2021"
description = "FDS local knowledge database CLI"

[workspace]
members = ["fds-core"]
resolver = "2"

[[bin]]
name = "fds"
path = "src/main.rs"

[dependencies]
fds = { path = "fds-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
