   The Aero window FDS always had -- glass title bar split at the middle,
   jelly buttons, data set in pixels -- reinterpreted: luminous aqua light,
   softer depth, springy feedback, a night theme of its own. Everything is
   served by the fds binary; nothing is fetched from elsewhere.            */
@font-face {
  font-family: 'VT323';
  src: url('/assets/vt323.woff2') format('woff2');
  font-display: swap;
}

:root {
  --ui: 'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans JP', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;

  color-scheme: light;
  --desk-1: #0B5A9C; --desk-2: #07305E; --desk-3: #031630;

  --face: #FBFDFF; --face-2: #F1F6FB; --face-3: #E7EFF8; --zebra: #F6F9FD;
  --line: #D3DFEB; --line-2: #B4C7DB; --line-soft: #E7EEF6;
  --ink: #0E2238; --ink-2: #48627E; --ink-3: #7A90A8;

  --accent: #0A7BD6; --accent-2: #10A9C8; --accent-ink: #FFFFFF;
  --focus: 0 0 0 3px rgba(10, 123, 214, .30);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  /* Frutiger Aero's light: soft orbs over deep water, drawn once, never animated. */
  background:
    radial-gradient(38rem 26rem at 12% 8%, var(--orb-a), transparent 70%),
    radial-gradient(30rem 22rem at 88% 18%, var(--orb-b), transparent 70%),
    radial-gradient(46rem 30rem at 70% 110%, var(--orb-c), transparent 70%),
    radial-gradient(140% 110% at 50% 0%, var(--desk-1) 0%, var(--desk-2) 55%, var(--desk-3) 100%) fixed;
  background-color: var(--desk-3);
  color: var(--ink);
  font: 13px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  padding: 12px;
  overflow: hidden;
  scrollbar-color: var(--line-2) transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.px { font-family: var(--px); font-size: 17px; line-height: 1.1; letter-spacing: .01em; }
.kbd { font-family: var(--px); font-size: 14px; line-height: 1; color: var(--ink-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--face); }

/* ── Window ───────────────────────────────────────────────────────────── */
.win {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  border: 1px solid var(--glass-line);
  border-radius: var(--r-xl) var(--r-xl) var(--r-l) var(--r-l);
  overflow: hidden;
  box-shadow: var(--shadow-win);
  background: var(--face);
}
.titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 14px;
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(160%);
  border-bottom: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 var(--glass-edge);
}
.titlebar svg { width: 18px; height: 18px; flex: none; }
.titlebar .t { font-weight: 600; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .t b { font-family: var(--px); font-weight: 400; font-size: 20px; letter-spacing: .02em; }
.titlebar .sp { flex: 1; }
.lang, .iconbtn {
  font-size: 12px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--glass-line); background: var(--pill-bg); color: var(--ink); cursor: pointer;
  transition: transform .18s var(--spring), border-color .15s var(--ease);
}
.iconbtn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; }
.iconbtn svg { width: 15px; height: 15px; }
.iconbtn:hover, .lang:hover { border-color: var(--hover-line); }
.iconbtn:active { transform: scale(.92); }

/* ── Command bar ──────────────────────────────────────────────────────── */
.cmdbar {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 6px 8px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}
.cbtn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px; border: 1px solid transparent; border-radius: var(--r-m);
  background: transparent; cursor: pointer; white-space: nowrap;
  transition: transform .2s var(--spring), background-color .15s var(--ease), border-color .15s var(--ease);
}
.cbtn svg { width: 17px; height: 17px; flex: none; }
.cbtn:hover { border-color: var(--hover-line); background: var(--btn-hover); }
.cbtn:active { transform: scale(.96); transition-duration: .08s; }
.cbtn[disabled] { opacity: .45; pointer-events: none; }
.cbtn.hero { font-weight: 600; }
.sep { width: 1px; align-self: stretch; margin: 3px 5px; background: var(--line); }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--face);
  padding: 0 6px 0 10px; min-width: 15rem;
  transition: box-shadow .15s var(--ease), border-color .15s var(--ease);
}
.search svg { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.search input { border: 0; outline: 0; padding: 5px 0; width: 100%; background: transparent; }
.search:focus-within { border-color: var(--accent); box-shadow: var(--focus); }
.search .kbd { flex: none; }

/* ── Main split ───────────────────────────────────────────────────────── */
.main { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
.explorer { border-right: 1px solid var(--line); background: var(--face-2); overflow: auto; padding: 8px 6px; }
.ex-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 2px 8px 8px; }
.node {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 4px 8px 4px calc(8px + var(--d, 0) * 14px);
  border: 1px solid transparent; border-radius: var(--r-s); background: none; text-align: left; cursor: pointer;
  transition: background-color .12s var(--ease);
}
.node svg { width: 16px; height: 16px; flex: none; }
.node .n { margin-left: auto; font-family: var(--px); font-size: 16px; color: var(--ink-3); }
.node:hover { background: var(--hover); }
.node.on { background: var(--sel); border-color: var(--sel-line); }
.node .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.root { font-weight: 600; }
.ex-group { margin-top: 10px; }
.ex-group > .cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 4px 8px 3px; }

.work { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tabs { position: relative; display: flex; gap: 2px; padding: 6px 10px 0; background: var(--face-2); border-bottom: 1px solid var(--line); }
.tab {
  position: relative; padding: 7px 14px 8px; border: 0; border-radius: var(--r-m) var(--r-m) 0 0;
  background: transparent; color: var(--ink-2); cursor: pointer;
  transition: color .15s var(--ease), background-color .15s var(--ease);
}
.tab:hover { color: var(--ink); background: var(--hover); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; background: var(--face); box-shadow: 0 1px 0 var(--face); }
.tab-ind {
  position: absolute; left: 0; bottom: -1px; height: 3px; width: 0;
  border-radius: 3px 3px 0 0; background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: transform .42s var(--spring), width .42s var(--spring);
}
.pane { min-height: 0; overflow: hidden; }

/* Records: grid + detail */
.records { display: grid; grid-template-columns: 1fr 360px; height: 100%; min-height: 0; }
.grid-wrap { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
.grid { overflow: auto; }
table { border-collapse: collapse; width: 100%; }
thead th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); white-space: nowrap;
  padding: 7px 10px; background: var(--bar);
  border-bottom: 1px solid var(--line-2); cursor: pointer; user-select: none;
}
thead th:hover { color: var(--ink); }
thead th .ar { color: var(--accent); margin-left: 4px; }
tbody td { padding: 5px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22rem; }
tbody tr:nth-child(even) td { background: var(--zebra); }
tbody tr { cursor: default; }
tbody tr:hover td { background: var(--hover); }
tbody tr.on td { background: var(--row-sel); }
tbody tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.px, td .px { font-size: 17px; }
td.num { text-align: right; }
.kind, .tchip, .st { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.kind.fact { color: var(--green-fg); border-color: var(--green-bd); background: var(--green-bg); }
.kind.procedure { color: var(--amber-fg); border-color: var(--amber-bd); background: var(--amber-bg); }
.kind.knowledge { color: var(--blue-fg); border-color: var(--blue-bd); background: var(--blue-bg); }
.tchip { color: var(--violet-fg); border-color: var(--violet-bd); background: var(--violet-bg); }
.tchip.image { color: var(--teal-fg); border-color: var(--teal-bd); background: var(--teal-bg); }
.tchip.context { color: var(--violet-fg); border-color: var(--violet-bd); background: var(--violet-bg); }
.dot { font-size: 14px; }
.dot.on { color: var(--signal); text-shadow: 0 0 6px var(--signal); }
.dot.off { color: var(--line-2); }

.grid-foot { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--face-2); color: var(--ink-2); }
.grid-foot .sp { flex: 1; }
.filterchip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 4px 1px 10px; border-radius: 999px; border: 1px solid var(--amber-bd); background: var(--amber-bg); color: var(--amber-fg); }
.filterchip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 4px; border-radius: 999px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

.detail { border-left: 1px solid var(--line); background: var(--face-2); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.detail .empty { color: var(--ink-3); margin: auto 0; text-align: center; padding: 0 12px; }
.d-head { display: flex; flex-direction: column; gap: 6px; }
.d-title { font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; word-break: break-word; }
.d-id { font-family: var(--px); font-size: 16px; color: var(--ink-3); }
.box { border: 1px solid var(--line); background: var(--face); border-radius: var(--r-m); overflow: hidden; }
.box > .cap { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px; border-bottom: 1px solid var(--line-soft); background: var(--face-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 8px 10px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--px); font-size: 17px; word-break: break-word; }
.bodytext { margin: 0; padding: 10px; font-family: var(--px); font-size: 17px; line-height: 1.2; white-space: pre-wrap; word-break: break-word; max-height: 22rem; overflow: auto; }
.d-actions { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  padding: 5px 14px; border: 1px solid var(--btn-line); border-radius: var(--r-m); cursor: pointer;
  background: var(--btn); color: var(--ink);
  transition: transform .22s var(--spring), border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.btn:hover { border-color: var(--hover-line); background: var(--btn-hover); }
.btn:active { transform: scale(.96); transition-duration: .08s; }
.btn.primary { border-color: var(--primary-line); background: var(--primary); color: #fff; font-weight: 600; text-shadow: 0 1px 0 rgba(0, 40, 90, .35); box-shadow: 0 1px 0 rgba(255, 255, 255, .45) inset, 0 4px 12px rgba(10, 123, 214, .28); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { border-color: var(--red-bd); color: var(--bad); }
.btn.danger:hover { background: var(--danger-bg); }
.btn[disabled] { opacity: .5; pointer-events: none; }

.confirm { border: 1px solid var(--red-bd); background: var(--red-bg); border-radius: var(--r-m); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.confirm p { margin: 0; color: var(--red-fg); }

/* Query */
.query { display: grid; grid-template-rows: auto 1fr; height: 100%; min-height: 0; }
.editor { padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--face-2); display: flex; flex-direction: column; gap: 10px; }
.editor textarea {
  width: 100%; min-height: 4.5rem; resize: vertical;
  font-family: var(--px); font-size: 20px; line-height: 1.2;
  border: 1px solid var(--line-2); border-radius: var(--r-m); padding: 8px 10px; background: var(--face);
  transition: box-shadow .15s var(--ease), border-color .15s var(--ease);
}
.editor textarea:focus { outline: 0; border-color: var(--accent); box-shadow: var(--focus); }
.editor .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.editor label { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.field { border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 3px 6px; background: var(--face); }
.editor .hint { color: var(--ink-3); }
.history { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.history .cap { color: var(--ink-3); margin-right: 2px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--face); cursor: pointer; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .2s var(--spring); }
.chip:hover { border-color: var(--hover-line); background: var(--hover); }
.chip:active { transform: scale(.95); }

.results { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
.res-main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.conf { font-family: var(--px); font-size: 22px; padding: 0 10px; border-radius: 999px; border: 1px solid; line-height: 1.25; }
.conf.exact { color: var(--green-fg); border-color: var(--green-bd); background: var(--green-bg); }
.conf.strong { color: var(--blue-fg); border-color: var(--blue-bd); background: var(--blue-bg); }
.conf.weak { color: var(--amber-fg); border-color: var(--amber-bd); background: var(--amber-bg); }
.conf.none { color: var(--red-fg); border-color: var(--red-bd); background: var(--red-bg); }
.verdict .meta { color: var(--ink-2); }
.verdict .meta b { font-family: var(--px); font-size: 17px; font-weight: 400; color: var(--ink); }
.verdict .note { flex-basis: 100%; color: var(--ink-2); }
.res-empty { color: var(--ink-3); padding: 24px; text-align: center; }

/* Overview: a bento of tiles */
.status { overflow: auto; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 14px; align-content: start; }
.tile {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-l);
  background: var(--face); box-shadow: var(--shadow-tile);
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 46%; background: var(--gloss); pointer-events: none; }
.tile > * { position: relative; }
.tile.span2 { grid-column: span 2; }
.tile.wide { grid-column: 1 / -1; }
.tile .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tile .pair > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .pair .cap { font-size: 11px; color: var(--ink-3); }
.tile h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tile .big { font-family: var(--px); font-size: 60px; line-height: .85; letter-spacing: .01em; }
.tile .big small { font-family: var(--ui); font-size: 13px; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
.tile .lead { color: var(--ink-2); margin: 0; }
.tile .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tile pre { margin: 0; padding: 8px 10px; border-radius: var(--r-s); background: var(--face-2); border: 1px solid var(--line-soft); font-family: var(--px); font-size: 15px; line-height: 1.2; white-space: pre-wrap; word-break: break-all; }
.stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--face-3); }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
.legend b { font-family: var(--px); font-size: 16px; font-weight: 400; color: var(--ink); }
.ringrow { display: flex; align-items: center; gap: 14px; }
.ring { width: 76px; height: 76px; flex: none; }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--face-3); }
.ring .val { stroke: url(#ringgrad); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray .6s var(--ease); }
.ring text { font-family: var(--px); font-size: 22px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.barlist { display: flex; flex-direction: column; gap: 6px; }
.barlist .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.palette .q input:focus, .palette .q input:focus-visible { outline: none; box-shadow: none; }
.barlist .r .linkbtn { justify-self: start; max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist .r b { font-family: var(--px); font-size: 16px; font-weight: 400; }
.barlist .r i { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.meter { height: 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--face-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.status .muted { color: var(--ink-3); }

/* Status bar */
.statusbar { display: flex; align-items: center; flex-wrap: wrap; background: var(--bar); border-top: 1px solid var(--line); color: var(--ink-2); min-height: 26px; font-size: 12px; }
.statusbar > span { padding: 3px 12px; border-right: 1px solid var(--line); white-space: nowrap; }
.statusbar > span:last-child { border-right: 0; margin-left: auto; }
.statusbar b { font-family: var(--px); font-size: 16px; font-weight: 400; color: var(--ink); }
.statusbar .warn { color: var(--warn); }

/* Dialogs, the wizard, the palette: glass that arrives, not just appears */
.scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 10; padding: 16px; }
.dialog, .wizard {
  display: grid; overflow: hidden; background: var(--face); color: var(--ink);
  border: 1px solid var(--glass-line); border-radius: var(--r-xl) var(--r-xl) var(--r-l) var(--r-l); box-shadow: var(--shadow-pop);
  animation: arrive .32s var(--spring);
}
.dialog { width: min(580px, 100%); max-height: calc(100vh - 32px); grid-template-rows: auto 1fr auto; }
@keyframes arrive { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.dialog .body { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.dialog .hint { color: var(--ink-2); margin: 0; }
.dialog label { display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.dialog input, .dialog textarea, .editor-form input, .editor-form textarea, .mapgrid select, .mapgrid input, .wbody .field, .paste textarea {
  border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 6px 8px; background: var(--face); color: var(--ink);
  transition: box-shadow .15s var(--ease), border-color .15s var(--ease);
}
.dialog textarea, .editor-form textarea { font-family: var(--px); font-size: 17px; line-height: 1.2; min-height: 9rem; resize: vertical; }
.dialog input:focus, .dialog textarea:focus, .editor-form input:focus, .editor-form textarea:focus, .paste textarea:focus { outline: 0; border-color: var(--accent); box-shadow: var(--focus); }
.dialog .err { color: var(--bad); min-height: 1.2em; margin: 0; }
.dialog .foot, .wfoot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bar); border-top: 1px solid var(--line); }
.dialog .foot { justify-content: flex-end; }

/* Toasts */
.toasts { position: fixed; right: 22px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast {
  min-width: 15rem; max-width: 26rem; padding: 10px 14px; border-radius: var(--r-l);
  background: var(--toast-bg); backdrop-filter: blur(14px); border: 1px solid var(--line-2); color: var(--ink);
  box-shadow: var(--shadow-pop); animation: arrive .34s var(--spring);
}
.toast.bad { border-color: var(--red-bd); background: var(--red-bg); color: var(--red-fg); }
.toast b { font-family: var(--px); font-size: 17px; font-weight: 400; }

/* Export menu */
.menu-wrap { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 18rem; background: var(--glass-strong); backdrop-filter: blur(16px); border: 1px solid var(--line-2); border-radius: var(--r-l); box-shadow: var(--shadow-pop); padding: 4px; animation: arrive .26s var(--spring); }
.menu a { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; color: var(--ink); text-decoration: none; border-radius: var(--r-s); }
.menu a small { color: var(--ink-3); }
.menu a:hover, .menu a:focus-visible { background: var(--sel); }
.menu .cap { color: var(--ink-3); padding: 6px 10px; font-size: 11px; }

/* Import wizard */
.wizard { width: min(980px, 100%); height: min(720px, calc(100vh - 32px)); grid-template-rows: auto auto 1fr auto; }
.wsteps { display: flex; flex-wrap: wrap; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--face-2); }
.wstep { display: flex; align-items: center; gap: 7px; padding: 10px 14px 10px 0; color: var(--ink-3); }
.wstep .n { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; border: 1px solid var(--line-2); font-family: var(--px); font-size: 16px; background: var(--face); line-height: 1; }
.wstep.on { color: var(--ink); font-weight: 600; }
.wstep.on .n { border-color: var(--primary-line); background: var(--primary); color: #fff; }
.wstep.done .n { border-color: var(--green-bd); color: var(--ok); background: var(--green-bg); }
.wstep + .wstep::before { content: ""; width: 20px; height: 1px; background: var(--line-2); margin-right: 8px; }
.wbody { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.wbody > p { margin: 0; }
.wfoot .sp { flex: 1; }
.wfoot .err { color: var(--bad); }
.drop { border: 2px dashed var(--line-2); border-radius: var(--r-l); padding: 28px 16px; text-align: center; background: var(--face-2); color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; align-items: center; transition: border-color .15s var(--ease), background-color .15s var(--ease), transform .25s var(--spring); }
.drop.over { border-color: var(--accent); background: var(--sel); transform: scale(1.01); }
.drop .big { font-size: 14px; color: var(--ink); }
.paste { display: flex; flex-direction: column; gap: 6px; }
.paste textarea { width: 100%; min-height: 5.5rem; font-family: var(--px); font-size: 16px; line-height: 1.2; resize: vertical; }
.paste .row { display: flex; gap: 8px; align-items: center; }
.detect { border: 1px solid var(--green-bd); background: var(--green-bg); color: var(--green-fg); border-radius: var(--r-m); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.detect b { font-family: var(--px); font-size: 17px; font-weight: 400; }
.detect .nm { font-weight: 600; }
.docs-list { margin: 0; padding-left: 18px; color: var(--ink-2); columns: 2 16rem; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; flex-wrap: wrap; background: var(--face-2); padding: 2px; gap: 2px; }
.seg button { border: 0; border-radius: 999px; background: transparent; padding: 4px 12px; cursor: pointer; transition: background-color .15s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--face); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }
.mapgrid { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 8px 12px; align-items: center; max-width: 44rem; }
.mapgrid .req::after { content: " *"; color: var(--bad); }
.mapgrid .pair { display: flex; gap: 6px; }
.mapgrid .pair input { flex: 1; min-width: 0; }
.hintline { color: var(--ink-3); }
.miss { color: var(--bad); font-style: italic; }
.sumchips { display: flex; flex-wrap: wrap; gap: 6px; }
.st.new { color: var(--green-fg); border-color: var(--green-bd); background: var(--green-bg); }
.st.replace { color: var(--blue-fg); border-color: var(--blue-bd); background: var(--blue-bg); }
.st.unchanged { color: var(--slate-fg); border-color: var(--slate-bd); background: var(--slate-bg); }
.st.duplicate { color: var(--amber-fg); border-color: var(--amber-bd); background: var(--amber-bg); }
.st.error { color: var(--red-fg); border-color: var(--red-bd); background: var(--red-bg); }
.sumchips .st { font-size: 12.5px; padding: 3px 11px; }
.sumchips .st b { font-family: var(--px); font-size: 18px; font-weight: 400; margin-left: 2px; }
.wtable { border: 1px solid var(--line); border-radius: var(--r-m); overflow: auto; min-height: 8rem; }
.wtable td.msg { white-space: normal; color: var(--ink-2); max-width: 28rem; }
.choice { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--red-bd); background: var(--red-bg); border-radius: var(--r-m); padding: 10px 12px; }
.choice label { display: flex; gap: 6px; align-items: center; }
.bigdone { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; }
.bigdone svg { width: 38px; height: 38px; flex: none; }
.check { display: flex; gap: 6px; align-items: center; }

/* Types, links, contexts, edit */
.chips-line { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.modelnote { border: 1px solid var(--amber-bd); background: var(--amber-bg); color: var(--amber-fg); border-radius: var(--r-m); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.modelnote b { font-weight: 600; }
.bodytext .wl { border: 0; padding: 0 1px; background: none; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; border-radius: 3px; }
.bodytext .wl:hover { background: var(--sel); }
.bodytext .wl.dangling { color: var(--bad); text-decoration: underline dotted; cursor: help; }
.linklist { list-style: none; margin: 0; padding: 6px 0; }
.linklist li { padding: 3px 10px; display: flex; gap: 6px; align-items: baseline; }
.linklist button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit; }
.linklist button:hover { text-decoration: underline; }
.linklist .dangling { color: var(--ink-3); font-style: italic; }
.editor-form { display: flex; flex-direction: column; gap: 10px; }
.editor-form label { display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.editor-form textarea { min-height: 10rem; }
.editor-form .err { color: var(--bad); margin: 0; min-height: 1em; }
.ctxmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.ctxmeta b { font-family: var(--px); font-size: 17px; font-weight: 400; color: var(--ink); }

/* Graph */
.graphwrap { display: grid; grid-template-columns: 1fr 360px; height: 100%; min-height: 0; }
.graphmain { position: relative; min-width: 0; min-height: 0; background: var(--graph-bg); }
.graphmain canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.graphmain canvas.dragging { cursor: grabbing; }
.graphbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; pointer-events: none; }
.graphbar > * { pointer-events: auto; }
.graphbar .pill { background: var(--pill-bg); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--ink-2); }
.graphbar .pill b { font-family: var(--px); font-size: 16px; font-weight: 400; color: var(--ink); }
.graphlegend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; background: var(--pill-bg); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink-2); font-size: 11.5px; }
.graphlegend i { display: inline-block; width: 9px; height: 9px; border-radius: 999px; margin-right: 5px; vertical-align: -1px; }
.graphempty { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; color: var(--ink-3); text-align: center; padding: 24px; pointer-events: none; }

/* The pixel orca, for the moments when there is nothing to show */
.orca { width: 72px; height: 40px; color: var(--ink); shape-rendering: crispEdges; image-rendering: pixelated; opacity: .9; }
.orca .belly { fill: var(--face); }
.orca-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-3); text-align: center; }

/* Command palette */
.palette-scrim { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding: 14vh 16px 16px; background: var(--scrim); backdrop-filter: blur(3px); }
.palette { width: min(640px, 100%); border-radius: var(--r-xl); overflow: hidden; background: var(--glass-strong); backdrop-filter: blur(22px) saturate(160%); border: 1px solid var(--line-2); box-shadow: var(--shadow-pop); animation: arrive .3s var(--spring); }
.palette .q { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.palette .q svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.palette input { flex: 1; border: 0; padding: 15px 0; font-size: 16px; background: transparent; color: var(--ink); outline: 0; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: min(52vh, 460px); overflow: auto; }
.palette .grp { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 4px; }
.palette .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-m); cursor: pointer; }
.palette .item.on { background: var(--sel); }
.palette .item .ic { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--face-2); border: 1px solid var(--line); flex: none; font-size: 12px; }
.palette .item .ic svg { width: 14px; height: 14px; }
.palette .item .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .item .sub { color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.palette .item .kbd { margin-left: auto; }
.palette .none { padding: 18px; text-align: center; color: var(--ink-3); }
.palette .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; background: var(--face-2); }

/* View transitions between tabs: a quick cross-fade, nothing that moves. */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .18s; }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .explorer { display: none; }
  .records, .results, .graphwrap { grid-template-columns: 1fr; }
  .detail { display: none; }
  .records.has-detail .detail, .results.has-detail .detail, .graphwrap.has-detail .detail { display: flex; border-left: 0; border-top: 1px solid var(--line); }
  .records.has-detail, .results.has-detail, .graphwrap.has-detail { grid-template-rows: 1fr 45%; }
  .tile.span2 { grid-column: span 1; }
  .search { min-width: 0; flex: 1 1 10rem; }
}
/* The three signals, obeyed without a switch. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .titlebar, .menu, .palette, .toast, .graphbar .pill, .graphlegend, .scrim, .palette-scrim { backdrop-filter: none; }
  .palette, .menu { background: var(--face); }
}
@media (prefers-contrast: more) {
  :root { --line: var(--ink-3); --line-soft: var(--line-2); }
  .kind, .tchip, .st, .conf { border-width: 2px; }
}

    <span class="menu-wrap">
      <button class="cbtn" id="b-export" type="button" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16"><path d="M8 10V2" stroke="#1E8F66" stroke-width="1.7" stroke-linecap="round"/><path d="M4.8 5.2 8 2l3.2 3.2" stroke="#1E8F66" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 10.5V13a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2.5" stroke="#4C6580" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span data-i18n="export">Exportar</span> &#9662;
      </button>
      <div class="menu" id="export-menu" hidden></div>
    </span>
    <span class="sep"></span>
    <button class="cbtn" id="b-fact" type="button">
      <svg viewBox="0 0 16 16"><path d="M8 1v6" stroke="#1E8F66" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="9.5" r="3.2" fill="#E6F6EE" stroke="#1E8F66" stroke-width="1.4"/><path d="M4 14.5h8" stroke="#1E8F66" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="newFact">Nuevo hecho</span>
    </button>
    <button class="cbtn" id="b-proc" type="button">
      <svg viewBox="0 0 16 16"><circle cx="3.5" cy="4" r="1.8" fill="#FCF5E4" stroke="#A56D05" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" fill="#FCF5E4" stroke="#A56D05" stroke-width="1.3"/><circle cx="12.5" cy="12" r="1.8" fill="#FCF5E4" stroke="#A56D05" stroke-width="1.3"/><path d="M5.2 4h1.3A1.5 1.5 0 0 1 8 5.5v.7M8 9.8v.7A1.5 1.5 0 0 0 9.5 12h1.3" stroke="#A56D05" stroke-width="1.3" fill="none"/></svg>
      <span data-i18n="newProc">Nuevo procedimiento</span>
    </button>
    <button class="cbtn" id="b-ctx" type="button">
      <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="#EFE8FB" stroke="#6B46C1" stroke-width="1.3"/><path d="M5 6h6M5 8.5h6M5 11h3.5" stroke="#6B46C1" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span data-i18n="newCtx">Nuevo contexto</span>
    </button>
    <span class="sep"></span>
    <button class="cbtn" id="b-embed" type="button">

      <span data-i18n="reload">Recargar</span>

      <div class="ex-h" data-i18n="explorer">Explorador</div>
      <div id="tree"></div>
    </nav>

    <div class="work">

        <span class="tab-ind" id="tab-ind" aria-hidden="true"></span>

        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="query" data-i18n="tabQuery">Consulta</button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="graph" data-i18n="tabGraph">Grafo</button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="status" data-i18n="tabStatus">Estado</button>
      </div>

      <section class="pane" id="p-records">
        <div class="records" id="records">
          <div class="grid-wrap">
            <div class="grid">
              <table>
                <thead><tr id="g-head"></tr></thead>
                <tbody id="g-body"></tbody>
              </table>

          </div>
          <aside class="detail" id="d-records"></aside>
        </div>
      </section>

      <section class="pane" id="p-query" hidden>

          <div class="editor">
            <textarea id="q" spellcheck="false" data-i18n-ph="queryPh" placeholder="Escribe una pregunta o una intención…"></textarea>

              <span class="hint" data-i18n="runHint">Ctrl+Intro</span>

                <select class="field" id="q-coll"></select></label>
              <label><span data-i18n="budget">Presupuesto</span>

              <label><input type="checkbox" id="q-links"> <span data-i18n="withLinks">Incluir enlaces</span></label>
            </div>
            <div class="history" id="q-hist"></div>
          </div>
          <div class="results" id="results">
            <div class="res-main">
              <div class="verdict" id="verdict"></div>
              <div class="grid">
                <table>
                  <thead><tr id="r-head"></tr></thead>
                  <tbody id="r-body"></tbody>
                </table>
              </div>
            </div>
            <aside class="detail" id="d-query"></aside>
          </div>
        </div>
      </section>

      <section class="pane" id="p-graph" hidden>
        <div class="graphwrap" id="graphwrap">
          <div class="graphmain" id="graphmain">
            <canvas id="graph"></canvas>
            <div class="graphbar" id="graphbar"></div>
            <div class="graphlegend" id="graphlegend"></div>
            <div class="graphempty" id="graphempty" hidden></div>
          </div>
          <aside class="detail" id="d-graph"></aside>
        </div>
      </section>

      <section class="pane" id="p-status" hidden>
        <div class="status" id="status"></div>
      </section>
    </div>
  </div>

  <div class="statusbar">

    <span><b id="sb-count">0</b> <span data-i18n="records">registros</span></span>

    <span id="sb-last"></span>

</div>

<div class="scrim" id="scrim" hidden>

</div>

/* ── DOM helper: every piece of data goes in as text, never as markup ──── */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

/* ── API ──────────────────────────────────────────────────────────────── */
async function api(method, path, body) {
  const opt = { method, headers: { "x-fds-token": TOKEN } };
  if (body !== undefined) { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(BASE + path, opt);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error) || (res.status + " " + res.statusText));
  return data;
}

function toast(msg, bad) {
  const n = el("div", { class: "toast" + (bad ? " bad" : "") }, msg);
  $("toasts").append(n);
  setTimeout(() => n.remove(), bad ? 7000 : 3200);
}

async function loadStatus() {
  S.status = await api("GET", "/status");
  S.contexts = await api("GET", "/contexts");
  renderChrome();
  renderTree();
  renderStatusPane();
  renderCollections();
}

async function loadRows(append) {
  const p = new URLSearchParams();
  if (S.filter.kind) p.set("kind", S.filter.kind);
  if (S.filter.collection) p.set("collection", S.filter.collection);
  if (S.filter.type) p.set("type", S.filter.type);
  if (S.filter.verified) p.set("verified_by", S.filter.verified);
  if (S.filter.search) p.set("search", S.filter.search);
  p.set("offset", append ? S.rows.length : 0);
  p.set("limit", 200);
  const r = await api("GET", "/records?" + p);
  S.rows = append ? S.rows.concat(r.rows) : r.rows;
  S.total = r.total;
  renderGrid();
}

async function refreshAll() {
  await loadStatus();
  await loadRows(false);

const PANES = { records: ["d-records", "records"], query: ["d-query", "results"], graph: ["d-graph", "graphwrap"] };

/* Body text with its [[links]] made clickable. Built from text nodes and
   buttons only: a record's content is never parsed as markup. */
function bodyWithLinks(text, links, where) {
  const pre = el("pre", { class: "bodytext" });
  const byTarget = new Map((links || []).map(l => [l.target, l.id]));
  const re = /\[\[([^\[\]|]+)(?:\|([^\[\]]+))?\]\]/g;
  let at = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > at) pre.append(document.createTextNode(text.slice(at, m.index)));
    const target = canonical(m[1]), shown = (m[2] || m[1]).trim(), id = byTarget.get(target);
    pre.append(id
      ? el("button", { class: "wl", type: "button", title: target, onclick: () => select(where, id) }, shown)
      : el("span", { class: "wl dangling", title: t("danglingHint", { target }) }, shown));
    at = m.index + m[0].length;
  }
  if (at < text.length) pre.append(document.createTextNode(text.slice(at)));
  return pre;
}

function linkBox(title, items) {
  const ul = el("ul", { class: "linklist" });
  for (const it of items) ul.append(el("li", {}, it));
  return el("div", { class: "box" }, el("div", { class: "cap", text: title }), ul);
}

async function renderDetail(where) {
  const [boxId, wrapId] = PANES[where];
  const box = $(boxId), wrap = $(wrapId);
  const id = S.selected[where];
  box.textContent = "";
  wrap.classList.toggle("has-detail", !!id);
  if (!id) { box.append(el("p", { class: "empty", text: t("selectHint") })); return; }

  let r;
  try { r = await api("GET", "/records/" + encodeURIComponent(id)); }
  catch (_) {
    // Gone -- deleted here, or from the CLI while the manager was open.
    if (S.selected[where] === id) S.selected[where] = null;
    wrap.classList.remove("has-detail");
    box.append(el("p", { class: "empty", text: t("selectHint") }));
    return;
  }
  if (S.selected[where] !== id) return; // a newer click won the race
  if (r.type === "context") return renderContextDetail(where, r);
  if (S.editing === r.id) return renderEditor(where, r);

  let body = r.body;
  if (r.kind === "procedure") { try { body = JSON.stringify(JSON.parse(r.body), null, 2); } catch (_) {} }

/* Editing, the Obsidian way: the text, its [[links]] written inline, plus
   explicit links, type and title. Saving marks the record as verified. */
function renderEditor(where, r) {
  const box = $(PANES[where][0]);
  let body = r.body;
  if (r.kind === "procedure") { try { body = JSON.stringify(JSON.parse(r.body), null, 2); } catch (_) {} }
  const ta = el("textarea", { id: "ed-body", spellcheck: "false" }); ta.value = body;
  const title = el("input", { id: "ed-title", value: r.title });
  const type = el("input", { id: "ed-type", value: r.type || "", placeholder: "image, command, receta…" });
  const links = el("textarea", { id: "ed-links", spellcheck: "false", style: "min-height:4rem" }); links.value = (r.links_explicit || []).join("\n");
  const err = el("p", { class: "err" });
  const save = async () => {
    const patch = {};
    if (ta.value !== body) patch.body = ta.value;
    if (title.value.trim() !== r.title) patch.title = title.value;
    if (type.value.trim() !== (r.type || "")) patch.type = type.value;
    const newLinks = links.value.split("\n").map(x => x.trim()).filter(Boolean);
    if (JSON.stringify(newLinks) !== JSON.stringify(r.links_explicit || [])) patch.links = newLinks;
    if (!Object.keys(patch).length) patch.verify = true;
    try {
      await api("PATCH", "/records/" + encodeURIComponent(r.id), patch);
      S.editing = null;
      toast(el("span", {}, t("saved") + " · ", el("b", { text: short(r.id) })));
      await refreshAll(); renderDetail(where);
    } catch (e) { err.textContent = e.message; }
  };
  box.append(el("div", { class: "d-head" }, el("div", { class: "chips-line" }, kindChipEl(r.kind)), el("div", { class: "d-title", text: r.question || r.title })),
    el("div", { class: "editor-form" },
      el("label", {}, t(r.kind === "procedure" ? "stepsJson" : "body"), ta),
      el("p", { class: "hintline", text: t("editHint") }),
      el("label", {}, t("fTitle"), title),
      el("label", {}, t("fType"), type),
      el("label", {}, t("linksExplicit"), links),
      err,
      el("div", { class: "d-actions" },
        el("button", { class: "btn primary", type: "button", onclick: save }, t("saveVerify")),
        el("button", { class: "btn", type: "button", onclick: () => { S.editing = null; renderDetail(where); } }, t("cancel")))));
  ta.focus();
}

async function runQuery() {
  const q = $("q").value.trim();
  if (!q) { $("q").focus(); return; }
  const body = { q, budget: Math.max(1, parseInt($("q-budget").value, 10) || 400) };
  if ($("q-coll").value) body.collection = $("q-coll").value;
  if ($("q-links").checked) body.links = true;
  const btn = $("q-run"); btn.disabled = true;
  try {
    const started = performance.now();
    const r = await api("POST", "/query", body);
    r.round_ms = performance.now() - started;
    S.qresult = r;
    S.selected.query = r.records.length ? r.records[0].id : null;
    S.last = { confidence: r.confidence, ms: r.engine_ms };
    S.history = [q].concat(S.history.filter(h => h !== q)).slice(0, 8);
    renderHistory(); renderLast(); renderQueryResult();
    renderDetail("query");
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; }
}

/* A pixel orca, drawn from a map: B body, W belly. For empty states. */
const ORCA_MAP = [
  ".......BB.........",
  ".......BBB........",
  "......BBBB........",
  "..BBBBBBBBBBB.....",
  ".BBBBBBBBBBBBB...B",
  "BBWWBBBBBBBBBBBBBB",
  "BBBBBBBBBBBBBB..BB",
  ".WWWBBBBBBBBB....B",
  "..WWWWWWWB........",
  "...WWWW...........",
];
const ORCA_SVG = (() => {
  let r = "";
  ORCA_MAP.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "B") r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="currentColor"/>';
    if (c === "W") r += '<rect class="belly" x="' + x + '" y="' + y + '" width="1" height="1" stroke="currentColor" stroke-width=".08"/>';
  }));
  return '<svg class="orca" viewBox="0 0 18 10" aria-hidden="true">' + r + "</svg>";
})();
function orcaEmpty(text) {
  const box = el("div", { class: "orca-empty" });
  const holder = document.createElement("span");
  holder.innerHTML = ORCA_SVG; // static, trusted markup only
  box.append(holder.firstChild, el("span", { text }));
  return box;
}

/* ── Dialogs ──────────────────────────────────────────────────────────── */
let dialogSubmit = null, lastFocus = null;
function openDialog(title, fields, onSubmit) {
  lastFocus = document.activeElement;
  $("dlg-title").textContent = title;
  const b = $("dlg-body"); b.textContent = "";
  b.append(...fields, el("p", { class: "err", id: "dlg-err" }));
  dialogSubmit = onSubmit;
  $("scrim").hidden = false;
  const first = b.querySelector("input, textarea");
  if (first) first.focus();
}
function closeDialog() {
  $("scrim").hidden = true; dialogSubmit = null;
  if (lastFocus) lastFocus.focus();
}
function field(key, id, opts) {
  opts = opts || {};
  const input = opts.multiline
    ? el("textarea", { id, spellcheck: "false" })
    : el("input", { id, type: "text", autocomplete: "off", list: opts.list || null });
  if (opts.value) input.value = opts.value;
  return el("label", {}, t(key), input);
}
function collectionList() {
  const dl = el("datalist", { id: "dl-coll" });
  for (const c of Object.keys(S.status.collections || {})) dl.append(el("option", { value: c }));
  return dl;
}
function defaultCollection() { return S.filter.collection || Object.keys(S.status.collections || {})[0] || "default"; }

function newFact() {
  openDialog(t("newFact"), [
    el("p", { class: "hint", text: t("factHint") }),
    field("question", "f-q"), field("answer", "f-a", { multiline: true }),
    field("colCollection", "f-c", { list: "dl-coll", value: defaultCollection() }), collectionList(),
    field("srcLabel", "f-s", { value: "manager" }),
  ], async () => {
    const question = $("f-q").value.trim(), answer = $("f-a").value.trim();
    if (!question || !answer) throw new Error(t("required") + ": " + (!question ? t("question") : t("answer")));
    const r = await api("POST", "/facts", { question, answer, collection: $("f-c").value.trim(), source: $("f-s").value.trim() });
    return r.id;
  });
}

const PROC_TEMPLATE = JSON.stringify([
  { action: "open", url: "/clientes/nuevo" },
  { action: "fill", selector: "#cli_nombre", field: "name" },
  { action: "click", selector: "button[data-qa='guardar']" },
], null, 2);

function newProc() {
  openDialog(t("newProc"), [
    el("p", { class: "hint", text: t("procHint") }),
    field("intent", "p-i"), field("title", "p-t"),
    field("steps", "p-s", { multiline: true, value: PROC_TEMPLATE }),
    field("colCollection", "p-c", { list: "dl-coll", value: defaultCollection() }), collectionList(),
  ], async () => {
    const intent = $("p-i").value.trim();
    if (!intent) throw new Error(t("required") + ": " + t("intent"));
    let steps;
    try { steps = JSON.parse($("p-s").value); } catch (e) { throw new Error(t("invalidJson", { e: e.message })); }
    if (!Array.isArray(steps) || !steps.length) throw new Error(t("stepsArray"));
    const proc = { intent, steps };
    if ($("p-t").value.trim()) proc.title = $("p-t").value.trim();
    const coll = $("p-c").value.trim();
    const r = await api("POST", "/procedures" + (coll ? "?collection=" + encodeURIComponent(coll) : ""), proc);
    return r.ids[0];
  });
}

$("dialog").addEventListener("submit", async e => {
  e.preventDefault();
  if (!dialogSubmit) return;
  const save = $("dlg-save"); save.disabled = true;
  $("dlg-err").textContent = "";
  try {
    const id = await dialogSubmit();
    closeDialog();
    toast(el("span", {}, t("saved") + " · ", el("b", { text: short(id) })));
    S.selected.records = id;
    showTab("records");
    await refreshAll();
    renderGrid();
    renderTree();
  } catch (err) { $("dlg-err").textContent = err.message; }
  finally { save.disabled = false; }
});
$("dlg-cancel").addEventListener("click", closeDialog);
$("scrim").addEventListener("mousedown", e => { if (e.target === $("scrim")) closeDialog(); });

/* ── Tabs, language, keys ─────────────────────────────────────────────── */
const MOTION_OK = () => !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* The indicator slides to the selected tab on a spring; the panes swap
   inside a view transition where the browser has one. */
function moveTabInd() {
  const on = document.querySelector('.tab[aria-selected="true"]'), ind = $("tab-ind");
  if (!on || !ind) return;
  ind.style.width = on.offsetWidth + "px";
  ind.style.transform = "translateX(" + on.offsetLeft + "px)";
}
function showTab(name) {
  const current = document.querySelector('.tab[aria-selected="true"]')?.dataset.tab;
  if (current !== name && document.startViewTransition && MOTION_OK()) document.startViewTransition(() => showTabNow(name));
  else showTabNow(name);
}
function showTabNow(name) {
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  for (const p of ["records", "query", "graph", "status"]) $("p-" + p).hidden = p !== name;
  if (name === "query") setTimeout(() => $("q").focus(), 0);
  if (name === "graph") openGraph(); else stopGraph();
  moveTabInd();
}
window.addEventListener("resize", moveTabInd);
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => showTab(b.dataset.tab));

function applyLang(lang) {
  LANG = T[lang] ? lang : "es";
  document.documentElement.lang = LANG;
  $("lang").value = LANG;
  for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
  for (const n of document.querySelectorAll("[data-i18n-ph]")) n.placeholder = t(n.dataset.i18nPh);
  for (const n of document.querySelectorAll("[data-i18n-title]")) n.title = t(n.dataset.i18nTitle);
  if (S.status) { renderChrome(); renderTree(); renderStatusPane(); renderCollections(); renderGrid(); renderDetail("records"); renderHistory(); renderQueryResult(); }
  if (!$("wiz").hidden) renderWizard();
  if (!$("p-graph").hidden) { renderGraphBar(); drawGraph(); }
  if (!$("export-menu").hidden) renderExportMenu();
  renderThemeButton();
  requestAnimationFrame(moveTabInd);
  if (PAL.open) renderPalette();
}
$("lang").addEventListener("change", () => { applyLang($("lang").value); try { localStorage.setItem("fds.lang", LANG); } catch (_) {} });

let searchTimer = null;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => setFilter({ search: $("search").value.trim() }), 120);
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runQuery(); } });
$("q-run").addEventListener("click", runQuery);
$("b-fact").addEventListener("click", newFact);
$("b-proc").addEventListener("click", newProc);
$("b-ctx").addEventListener("click", () => editContext(null));
$("b-embed").addEventListener("click", doEmbed);
$("b-reload").addEventListener("click", doReload);
$("g-more").addEventListener("click", () => loadRows(true).catch(e => toast(e.message, true)));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("scrim").hidden) closeDialog();
  if (e.key === "/" && document.activeElement === document.body) { e.preventDefault(); $("search").focus(); }
});

/* ── Import wizard ────────────────────────────────────────────────────────
   Extract in the browser (read, decode, parse), map columns to FDS fields,
   then hand the rows to the server, which alone decides ids, validity and
   what each row would do. The preview is the server's dry run, not a guess
   made here -- so what you review is exactly what gets written.            */
const DOC_EXT = __FDS_DOC_EXT__;          // from ingest.rs, injected by the server
const IMG_EXT = __FDS_IMG_EXT__;          // from media.rs
const VISION_MODEL = "__FDS_VISION_MODEL__";
const MAX_IMAGE = 10 * 1024 * 1024;
const TABLE_EXT = ["csv", "tsv"], JSONL_EXT = ["jsonl", "ndjson"];
const MAX_IMPORT = 32 * 1024 * 1024;
const PREVIEW_ROWS = 6, REVIEW_CAP = 500;

const W = {};
function wizReset() {
  Object.assign(W, {
    step: 1, mode: null, name: "", table: null, map: null, passthrough: null, docs: [], ignored: 0,
    collection: "", plan: null, filter: "all", onError: "abort", embedAfter: true,
    result: null, embedded: null, embedError: null, busy: false, error: "",
  });
}
wizReset();

const extOf = n => { const i = n.lastIndexOf("."); return i < 0 ? "" : n.slice(i + 1).toLowerCase(); };
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* Excel in Spanish, French or German saves CSV as Windows-1252, not UTF-8.
   Try strict UTF-8 first; if that is not what the bytes are, fall back. */
/* An image travels as base64. Built in chunks: spreading a large buffer
   into String.fromCharCode at once overflows the call stack. */
async function toBase64(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function decode(file) {
  const buf = await file.arrayBuffer();
  let text, encoding = "UTF-8";
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (_) { text = new TextDecoder("windows-1252").decode(buf); encoding = "Windows-1252"; }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return { text, encoding };
}

/* The delimiter used most often, outside quotes, on the header line. Excel
   in continental locales writes `;`; a paste from Excel is tab-separated. */
function detectDelimiter(text) {
  const line = text.split(/\r?\n/).find(l => l.trim()) || "";
  let best = ",", most = -1;
  for (const d of [",", ";", "\t", "|"]) {
    let n = 0, q = false;
    for (const ch of line) { if (ch === '"') q = !q; else if (!q && ch === d) n++; }
    if (n > most) { most = n; best = d; }
  }
  return best;
}

/* RFC 4180: quoted cells may hold the delimiter, doubled quotes, newlines.
   Also undoes the export's formula guard: a leading apostrophe before
   = + - @ is stripped, so `-5 V` survives a trip through a spreadsheet. */
function parseCSV(text, d) {
  const rows = []; let row = [], cell = "", q = false;
  const unguard = v => (v.length > 1 && v[0] === "'" && "=+-@\t\r".includes(v[1])) ? v.slice(1) : v;
  const endCell = () => { row.push(unguard(cell)); cell = ""; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) endCell();
    else if (c === "\n") { endCell(); rows.push(row); row = []; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { endCell(); rows.push(row); }
  const full = rows.filter(r => r.some(c => c.trim() !== ""));
  return { rows: full, empty: rows.length - full.length };
}

function objectsToTable(objs) {
  const headers = [];
  for (const o of objs) for (const k of Object.keys(o)) if (!headers.includes(k)) headers.push(k);
  const rows = objs.map(o => headers.map(h => {
    const v = o[h];
    return v == null ? "" : typeof v === "string" ? v : JSON.stringify(v);
  }));
  return { headers, rows, empty: 0 };
}

/* Objects that already speak FDS (an export, or a hand-written file) go
   through untouched, so fields beyond the ones mapped here -- a procedure's
   extra keys -- are kept. */
const isFdsShape = objs => objs.length > 0 && objs.every(o =>
  typeof o.kind === "string" && ["fact", "procedure", "knowledge", "hecho", "procedimiento", "conocimiento"].includes(o.kind.trim().toLowerCase()));

// Column names, the fields each kind may carry, and the words that make a
// "tipo" column the kind: defined once in tabular.rs, handed over by the server.
const TABULAR = __FDS_TABULAR__;
const KIND_WORDS = TABULAR.kind_words;
const ALIASES = TABULAR.aliases;
const FIELDS = TABULAR.fields;
const REQUIRED = { fact: ["question", "answer"], procedure: ["intent"], context: ["title"] };
const FIELD_KEY = { question: "fQuestion", answer: "fAnswer", intent: "fIntent", title: "fTitle", steps: "fSteps", command: "fCommand",
  shell: "fShell", collection: "fCollection", source: "fSource", verified_by: "fVerifiedBy", last_verified: "fLastVerified", kind: "fKind",
  type: "fType", attrs: "fAttrs", links: "fLinks" };

function autoMap(headers) {
  const n = headers.map(norm), cols = {};
  for (const [f, al] of Object.entries(ALIASES)) cols[f] = n.findIndex(h => al.includes(h));
  // A column called "tipo" or "type" is the kind when its values are kinds
  // (hecho, procedure, ...) and the free type otherwise.
  if (cols.kind < 0 && cols.type >= 0 && W.table) {
    const vals = W.table.rows.slice(0, 50).map(r => norm(r[cols.type] || "")).filter(Boolean);
    const kindish = vals.filter(v => KIND_WORDS.includes(v)).length;
    if (vals.length && kindish / vals.length >= 0.8) { cols.kind = cols.type; cols.type = -1; }
  }
  const looksProc = (cols.intent >= 0 || cols.steps >= 0 || cols.command >= 0) && cols.answer < 0;
  return { kind: cols.kind >= 0 ? "column" : looksProc ? "procedure" : "fact", cols };
}

function acceptText(text, name, ext, encoding) {
  W.name = name; W.docs = []; W.passthrough = null; W.table = null; W.map = null;
  const trimmed = text.trim();
  if (!trimmed) throw new Error(t("wEmpty"));
  let objs = null;
  if (ext === "json" || (!ext && /^[\[{]/.test(trimmed))) {
    const v = JSON.parse(trimmed);
    objs = Array.isArray(v) ? v : Array.isArray(v.entries) ? v.entries : Array.isArray(v.rows) ? v.rows : [v];
  } else if (JSONL_EXT.includes(ext)) {
    objs = trimmed.split(/\r?\n/).filter(l => l.trim()).map((l, i) => {
      try { return JSON.parse(l); } catch (e) { throw new Error(t("wLine", { n: i + 1 }) + ": " + e.message); }
    });
  }
  if (objs) {
    if (!objs.every(o => o && typeof o === "object" && !Array.isArray(o))) throw new Error(t("wNotObjects"));
    if (isFdsShape(objs)) {
      W.passthrough = objs;
      W.detail = { format: "JSON", encoding, rows: objs.length };
    } else {
      W.table = objectsToTable(objs);
      W.detail = { format: "JSON", encoding, rows: W.table.rows.length, cols: W.table.headers.length };
    }
  } else {
    const d = ext === "tsv" ? "\t" : detectDelimiter(text);
    const parsed = parseCSV(text, d);
    if (parsed.rows.length < 2) throw new Error(t("wNeedHeader"));
    const headers = parsed.rows[0].map((h, i) => h.trim() || "col" + (i + 1));
    W.table = { headers, rows: parsed.rows.slice(1), empty: parsed.empty };
    W.detail = { format: d === "\t" ? "TSV" : "CSV", delimiter: d, encoding, rows: W.table.rows.length, cols: headers.length, empty: parsed.empty };
  }
  W.mode = "table";
  if (W.table) W.map = autoMap(W.table.headers);   // W.table is set: autoMap may read values
  W.collection = defaultCollection();
}

async function loadFiles(list) {
  W.error = "";
  let files = [...list];
  if (!files.length) return;
  const fromFolder = files.some(f => f.webkitRelativePath);
  // A folder brings whatever is in it; keep what FDS can ingest and say so.
  if (fromFolder) {
    const keep = files.filter(f => (DOC_EXT.includes(extOf(f.name)) || IMG_EXT.includes(extOf(f.name))) && !/(^|\/)(\.git|node_modules|target|\.venv|venv|__pycache__|dist|build)\//.test(f.webkitRelativePath));
    W.ignored = files.length - keep.length;
    files = keep;
    if (!files.length) return wizFail(t("wNothingInFolder"));
  } else W.ignored = 0;

  const big = files.find(f => f.size > (IMG_EXT.includes(extOf(f.name)) ? MAX_IMAGE : MAX_IMPORT));
  if (big) return wizFail(t(IMG_EXT.includes(extOf(big.name)) ? "wImgTooBig" : "wTooBig", { name: big.name }));
  const tables = fromFolder ? [] : files.filter(f => [...TABLE_EXT, "json", ...JSONL_EXT].includes(extOf(f.name)));
  if (tables.length && files.length > 1) return wizFail(t("wOneTable"));

  try {
    if (tables.length) {
      const { text, encoding } = await decode(tables[0]);
      acceptText(text, tables[0].name, extOf(tables[0].name), encoding);
    } else {
      W.mode = "docs"; W.table = null; W.passthrough = null; W.docs = [];
      for (const f of files) {
        const name = f.webkitRelativePath || f.name;
        if (IMG_EXT.includes(extOf(f.name))) W.docs.push({ name, image: true, data: await toBase64(f), media_type: f.type || "", size: f.size });
        else { const { text } = await decode(f); W.docs.push({ name, text, size: f.size }); }
      }
      W.name = W.docs.length === 1 ? W.docs[0].name : t("wDocs", { n: W.docs.length });
      W.collection = defaultCollection();
    }
  } catch (e) { return wizFail(t("wUnreadable", { name: files[0].name }) + " " + e.message); }
  renderWizard();
}

function acceptPaste() {
  const text = $("wiz-paste").value;
  W.error = "";
  try { acceptText(text, t("wPasted"), "", "—"); }
  catch (e) { W.error = e.message; W.mode = null; }
  renderWizard();
}

function wizFail(msg) { W.error = msg; W.mode = null; renderWizard(); }

/* ── Mapping ──────────────────────────────────────────────────────────── */
function rowKind(cells) {
  if (W.map.kind !== "column") return W.map.kind;
  const raw = (cells[W.map.cols.kind] || "").trim();
  return { fact: "fact", hecho: "fact", procedure: "procedure", procedimiento: "procedure", context: "context", contexto: "context" }[norm(raw)] || raw;
}
const fieldsFor = kind => FIELDS[kind] || [...new Set([...FIELDS.fact, ...FIELDS.procedure, ...FIELDS.context])];

function mapRow(cells) {
  const kind = rowKind(cells), o = { kind };
  for (const f of fieldsFor(kind)) {
    const c = W.map.cols[f];
    if (c >= 0) { const v = (cells[c] ?? "").trim(); if (v) o[f] = v; }
  }
  return o;
}
const mappedRows = () => W.table.rows.map(mapRow);

function missingIn(o) {
  const req = REQUIRED[o.kind];
  if (!req) return [t("fKind")];
  const miss = req.filter(f => !o[f]).map(f => t(FIELD_KEY[f]));
  if (o.kind === "procedure" && !o.steps && !o.command) miss.push(t("fSteps") + " / " + t("fCommand"));
  return miss;
}

function importBody(dry) {
  const b = { dry_run: dry, on_error: W.onError, collection: W.collection || "default" };
  if (W.mode === "docs") {
    b.documents = W.docs.map(d => d.image ? { name: d.name, data: d.data, media_type: d.media_type || undefined } : { name: d.name, text: d.text });
    b.lang = LANG;   // images are described in the language of the manager
  }
  else if (W.passthrough) { b.rows = W.passthrough; b.source = W.name; }
  else { b.rows = mappedRows(); b.source = W.name; }
  return b;
}

async function postImport(dry) {
  const res = await fetch(BASE + "/import", {
    method: "POST",
    headers: { "content-type": "application/json", "x-fds-token": TOKEN },
    body: JSON.stringify(importBody(dry)),
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok && res.status !== 422) throw new Error((data && data.error) || res.status + " " + res.statusText);
  return { status: res.status, data };
}

async function wizReview() {
  if (W.mode === "table" && W.table) {
    const k = W.map.kind, c = W.map.cols;
    const bad = k !== "column" && (REQUIRED[k].some(f => c[f] < 0) || (k === "procedure" && c.steps < 0 && c.command < 0));
    if (bad) { W.error = t("wMapRequired"); return renderWizard(); }
  }
  W.busy = true; W.error = ""; renderWizard();
  try {
    const { data } = await postImport(true);
    W.plan = data; W.step = 3; W.filter = data.summary.error ? "error" : "all";
  } catch (e) { W.error = e.message; }
  W.busy = false; renderWizard();
}

async function wizLoad() {
  W.busy = true; W.error = ""; renderWizard();
  try {
    const { status, data } = await postImport(false);
    if (status === 422) { W.plan = data; W.error = t("wBlocked", { n: data.summary.error }); }
    else {
      W.result = data; W.step = 4;
      if (data.written && W.embedAfter && S.status.embedding_model) {
        try { W.embedded = (await api("POST", "/embed", {})).embedded; }
        catch (e) { W.embedError = e.message; }
      }
      await refreshAll();
    }
  } catch (e) { W.error = e.message; }
  W.busy = false; renderWizard();
}

/* ── Graph ────────────────────────────────────────────────────────────────
   Records as nodes, resolved links as edges: the database's shape, the way
   Obsidian draws a vault. A small force simulation, no library -- the page
   loads nothing it does not ship. It settles and stops on its own; dragging
   a node wakes it. With reduced motion it is solved at once and drawn still. */
const MAX_GRAPH = 600;
const G = { nodes: [], edges: [], byId: new Map(), running: false, raf: 0, alpha: 0,
  view: { x: 0, y: 0, k: 1 }, drag: null, hover: -1, onlyLinked: true, total: 0, totalEdges: 0 };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// Colours come from the theme's tokens, so the night theme redraws the graph too.
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const gcolor = () => ({ fact: cssVar("--g-fact"), procedure: cssVar("--g-proc"), knowledge: cssVar("--g-know"), image: cssVar("--g-img"), context: cssVar("--g-ctx") });
let GCOLOR = gcolor();
const nodeColor = n => GCOLOR[n.type === "context" || n.type === "image" ? n.type : n.kind] || cssVar("--ink-3");

async function openGraph() {
  let g;
  try { g = await api("GET", "/graph"); } catch (e) { toast(e.message, true); return; }
  const first = !G.nodes.length;
  buildGraph(g);
  renderGraphBar();
  resizeGraph();
  if (first) {
    for (let i = 0, n = REDUCED || G.nodes.length <= 200 ? 320 : 120; i < n; i++) tick();
    centerGraph();
  }
  startGraph();
  renderDetail("graph");
}

function buildGraph(g) {
  const coll = S.filter.collection;
  let idx = g.nodes.map((_, i) => i).filter(i => !coll || g.nodes[i].collection === coll);
  const inScope = new Set(idx);
  const edges = g.edges.filter(([a, b]) => inScope.has(a) && inScope.has(b));
  const deg = new Map();
  for (const [a, b] of edges) { deg.set(a, (deg.get(a) || 0) + 1); deg.set(b, (deg.get(b) || 0) + 1); }
  G.total = idx.length; G.totalEdges = edges.length;
  if (G.onlyLinked && edges.length) idx = idx.filter(i => deg.get(i));
  if (idx.length > MAX_GRAPH) idx = idx.sort((a, b) => (deg.get(b) || 0) - (deg.get(a) || 0)).slice(0, MAX_GRAPH);

  // Keep the place of nodes already on screen, so a refresh does not scatter them.
  const old = new Map(G.nodes.map(n => [n.id, n]));
  G.nodes = idx.map((i, j) => {
    const n = g.nodes[i], o = old.get(n.id), a = j * 2.399963, r = 14 * Math.sqrt(j + 1);
    return { ...n, deg: deg.get(i) || 0, x: o ? o.x : Math.cos(a) * r, y: o ? o.y : Math.sin(a) * r, vx: 0, vy: 0, fixed: false };
  });
  const at = new Map(idx.map((i, j) => [i, j]));
  G.edges = edges.filter(([a, b]) => at.has(a) && at.has(b)).map(([a, b]) => [at.get(a), at.get(b)]);
  G.byId = new Map(G.nodes.map((n, j) => [n.id, j]));
  G.alpha = 1;
}

function tick() {
  const N = G.nodes, a = G.alpha;
  for (let i = 0; i < N.length; i++) {
    for (let j = i + 1; j < N.length; j++) {
      let dx = N[j].x - N[i].x, dy = N[j].y - N[i].y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 160000) continue;
      if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = .5; }
      const d = Math.sqrt(d2), f = 2600 * a / d2;
      dx /= d; dy /= d;
      N[i].vx -= dx * f; N[i].vy -= dy * f; N[j].vx += dx * f; N[j].vy += dy * f;
    }
  }
  for (const [i, j] of G.edges) {
    const A = N[i], B = N[j];
    let dx = B.x - A.x, dy = B.y - A.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 120) * 0.05 * a;
    dx /= d; dy /= d;
    A.vx += dx * f; A.vy += dy * f; B.vx -= dx * f; B.vy -= dy * f;
  }
  for (const n of N) {
    if (n.fixed) { n.vx = n.vy = 0; continue; }
    n.vx = (n.vx - n.x * 0.01 * a) * 0.8;
    n.vy = (n.vy - n.y * 0.01 * a) * 0.8;
    n.x += n.vx; n.y += n.vy;
  }
  G.alpha *= 0.985;
}

function frame() {
  tick(); drawGraph();
  if (G.alpha > 0.015 || G.drag) G.raf = requestAnimationFrame(frame);
  else G.running = false;
}
function startGraph() {
  G.alpha = Math.max(G.alpha, 0.5);
  if (REDUCED) { for (let i = 0; i < 320; i++) tick(); drawGraph(); return; }
  if (!G.running) { G.running = true; G.raf = requestAnimationFrame(frame); }
}
function stopGraph() { cancelAnimationFrame(G.raf); G.running = false; }

function resizeGraph() {
  const cv = $("graph"), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(cv.clientWidth * dpr));
  cv.height = Math.max(1, Math.round(cv.clientHeight * dpr));
  drawGraph();
}

(function earlyTheme() {
  try { const th = localStorage.getItem(THEME_KEY); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (_) {}
})();

(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem("fds.lang"); } catch (_) {}
  const guess = (navigator.language || "es").slice(0, 2).toLowerCase();
  applyLang(saved || (T[guess] ? guess : "es"));
  try {
    await refreshAll();
    renderQueryResult();
  } catch (e) {
    toast(e.message, true);
  }
})();
